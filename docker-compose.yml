name: wazuh

services:

  certificates:
    image: wazuh/wazuh-certs-generator:0.0.5
    restart: "no"
    cpus: 0.125
    mem_limit: 256m
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        missing=0
        for cert in root-ca.pem root-ca-manager.pem \
          admin.pem admin-key.pem wazuh.indexer.pem wazuh.indexer-key.pem \
          wazuh.manager.pem wazuh.manager-key.pem \
          wazuh.dashboard.pem wazuh.dashboard-key.pem; do
          if [ ! -s "/certificates/$$cert" ]; then
            missing=1
            break
          fi
        done
        if [ "$$missing" -eq 1 ]; then
          echo "Generating missing Wazuh TLS certificates."
          /entrypoint.sh || exit $$?
        else
          echo "Wazuh TLS certificates already exist; keeping them."
        fi
        chmod 0755 /certificates
        rm -f /certificates/root-ca.key /certificates/root-ca-manager.key
    environment:
      CERT_TOOL_VERSION: "4.14"
      CERT_TOOL_REPOSITORY: ${CERT_TOOL_REPOSITORY:-prod}
    volumes:
      - wazuh_certs:/certificates
      - ./wazuh/config/certs.yml:/config/certs.yml:ro

  wazuh.manager:
    image: wazuh/wazuh-manager:4.14.11
    hostname: wazuh.manager
    restart: always
    cpus: 0.5
    mem_limit: 768m
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 655360
        hard: 655360
    ports:
      - "1514:1514"
      - "1515:1515"
      - "514:514/udp"
      - "127.0.0.1:55000:55000"
    environment:
      - INDEXER_URL="https://wazuh.indexer:9200"
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=${INDEXER_PASSWORD:?Definir INDEXER_PASSWORD dans .env}
      - FILEBEAT_SSL_VERIFICATION_MODE=full
      - SSL_CERTIFICATE_AUTHORITIES=/wazuh-certs/root-ca-manager.pem
      - SSL_CERTIFICATE=/wazuh-certs/wazuh.manager.pem
      - SSL_KEY=/wazuh-certs/wazuh.manager-key.pem
      - API_USERNAME=wazuh-wui
      - API_PASSWORD=${API_PASSWORD:?Definir API_PASSWORD dans .env}
    volumes:
      - wazuh_api_configuration:/var/ossec/api/configuration
      - wazuh_etc:/var/ossec/etc
      - wazuh_logs:/var/ossec/logs
      - wazuh_queue:/var/ossec/queue
      - wazuh_var_multigroups:/var/ossec/var/multigroups
      - wazuh_integrations:/var/ossec/integrations
      - wazuh_active_response:/var/ossec/active-response/bin
      - wazuh_agentless:/var/ossec/agentless
      - wazuh_wodles:/var/ossec/wodles
      - filebeat_etc:/etc/filebeat
      - filebeat_var:/var/lib/filebeat
      - wazuh_certs:/wazuh-certs:ro
      - ./wazuh/config/wazuh_cluster/wazuh_manager.conf:/wazuh-config-mount/etc/ossec.conf
    depends_on:
      certificates:
        condition: service_completed_successfully

  wazuh.indexer:
    image: wazuh/wazuh-indexer:4.14.11
    hostname: wazuh.indexer
    restart: unless-stopped
    depends_on:
      certificates:
        condition: service_completed_successfully
    environment:
      OPENSEARCH_JAVA_OPTS: "-Xms1g -Xmx1g"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - wazuh_indexer_data:/var/lib/wazuh-indexer
      - wazuh_certs:/usr/share/wazuh-indexer/config/certs
      - ./wazuh/config/wazuh_indexer/opensearch.yml:/usr/share/wazuh-indexer/config/opensearch.yml
      - ./wazuh/config/wazuh_indexer/internal_users.yml:/usr/share/wazuh-indexer/config/opensearch-security/internal_users.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fks https://localhost:9200/_plugins/_security/health | grep -q '\\\"status\\\":\\\"UP\\\"'"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 90s

  wazuh.dashboard:
    image: wazuh/wazuh-dashboard:4.14.11
    hostname: wazuh.dashboard
    restart: always
    cpus: 0.25
    mem_limit: 512m
    ports:
      - "127.0.0.1:443:5601"
    environment:
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=${INDEXER_PASSWORD:?Definir INDEXER_PASSWORD dans .env}
      - WAZUH_API_URL=https://wazuh.manager
      - DASHBOARD_USERNAME=kibanaserver
      - DASHBOARD_PASSWORD=${DASHBOARD_PASSWORD:?Definir DASHBOARD_PASSWORD dans .env}
      - API_USERNAME=wazuh-wui
      - API_PASSWORD=${API_PASSWORD:?Definir API_PASSWORD dans .env}
    volumes:
      - wazuh_certs:/usr/share/wazuh-dashboard/certs:ro
      - ./wazuh/config/wazuh_dashboard/opensearch_dashboards.yml:/usr/share/wazuh-dashboard/config/opensearch_dashboards.yml
      - ./wazuh/config/wazuh_dashboard/wazuh.yml:/usr/share/wazuh-dashboard/data/wazuh/config/wazuh.yml
      - wazuh-dashboard-config:/usr/share/wazuh-dashboard/data/wazuh/config
      - wazuh-dashboard-custom:/usr/share/wazuh-dashboard/plugins/wazuh/public/assets/custom
    depends_on:
      wazuh.indexer:
        condition: service_started
      wazuh.manager:
        condition: service_started
      certificates:
        condition: service_completed_successfully
    links:
      - wazuh.indexer:wazuh.indexer
      - wazuh.manager:wazuh.manager

  webserver:
    build:
      context: ./endpoints/webserver
    image: monitoring-webserver:4.14.11
    hostname: webserver
    restart: always
    cpus: 0.125
    mem_limit: 256m
    ports:
      - "127.0.0.1:8080:80"
      - "127.0.0.1:2222:22"
    environment:
      SSH_PUBLIC_KEY: ${SSH_PUBLIC_KEY:-}
      WAZUH_MANAGER_SERVER: wazuh.manager
      WAZUH_AGENT_NAME: webserver
      RESOURCE_SERVICE: webserver
    volumes:
      - webserver_wazuh_etc:/var/ossec/etc
      - webserver_wazuh_logs:/var/ossec/logs
      - webserver_wazuh_queue:/var/ossec/queue
      - webserver_ssh_keys:/home/webadmin/.ssh
    depends_on:
      - wazuh.manager

  database:
    build:
      context: ./endpoints/database
    image: monitoring-database:4.14.11
    hostname: database
    restart: always
    cpus: 0.125
    mem_limit: 512m
    ports:
      - "127.0.0.1:3307:3306"
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-}
      WAZUH_MANAGER_SERVER: wazuh.manager
      WAZUH_AGENT_NAME: database
      RESOURCE_SERVICE: database
      RESOURCE_METRICS_INTERVAL: 5
    volumes:
      - database_data:/var/lib/mysql
      - database_logs:/var/log/mysql
      - database_wazuh_etc:/var/ossec/etc
      - database_wazuh_logs:/var/ossec/logs
      - database_wazuh_queue:/var/ossec/queue
    depends_on:
      - wazuh.manager

volumes:
  wazuh_certs:
  wazuh_api_configuration:
  wazuh_etc:
  wazuh_logs:
  wazuh_queue:
  wazuh_var_multigroups:
  wazuh_integrations:
  wazuh_active_response:
  wazuh_agentless:
  wazuh_wodles:
  filebeat_etc:
  filebeat_var:
  wazuh_indexer_data:
  wazuh-dashboard-config:
  wazuh-dashboard-custom:
  webserver_wazuh_etc:
  webserver_wazuh_logs:
  webserver_wazuh_queue:
  webserver_ssh_keys:
  database_data:
  database_logs:
  database_wazuh_etc:
  database_wazuh_logs:
  database_wazuh_queue: